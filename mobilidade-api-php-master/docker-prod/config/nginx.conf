user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    ##
    # Gzip
    ##
    gzip                on;
    gzip_comp_level     5;
    gzip_min_length     1100;
    gzip_buffers        4 8k;
    gzip_http_version   1.0;
    gzip_proxied        expired no-cache no-store private auth;
    gzip_vary           on;
    gzip_static         on;  # já ligado aqui; não precisa repetir em location
    gzip_disable        "MSIE [1-6]\.";
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        font/truetype
        font/woff
        font/woff2
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;

    ##
    # SSL (se usar 443 em outro server block)
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ##
    # Expires map — valores válidos
    ##
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
    }

    server {
        listen       8080;
        listen       80;
        listen       81;
        server_name  _;
        root   /var/www/html/public;
        index  index.php index.html index.htm;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        charset utf-8;

        client_max_body_size 20M;

        # aplica o map acima
        expires $expires;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
            # gzip_static já está ativado no http{}
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_index index.php;
            fastcgi_keep_conn on;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # buffers/timeouts seguros para respostas maiores
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }

        # Oculta pontos / exceto .well-known
        location ~ /\.(?!well-known).* { deny all; }

        # Arquivos de fontes simplificado
        location ~* \.(?:eot|woff|woff2|ttf|svg|otf)$ {
            expires max;
            add_header Access-Control-Allow-Origin "*";
        }
    }
}