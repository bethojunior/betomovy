<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        @media only screen and (max-width: 640px) {
            table {
                width: 100% !important;
                min-width: 200px !important;
            }

            img[class="partial-image"] {
                width: 100% !important;
                min-width: 120px !important;
            }
        }
    </style>
</head>

<body topmargin="0" leftmargin="0">
<!--?xml encoding="utf-8" ?-->
<table style="border-collapse: collapse; border-spacing: 0; min-height: 418px;" cellpadding="0" cellspacing="0"
       width="100%" bgcolor="#f2f2f2">
    <tbody>
    <tr>
        <td align="center" style="border-collapse: collapse; padding-top: 30px; padding-bottom: 30px;">
            <table cellpadding="5" cellspacing="5" width="600" bgcolor="white"
                   style="border-collapse: collapse; border-spacing: 0;">
                <tbody>
                <tr>
                    <td style="border-collapse: collapse; width: 600px; padding: 0px; text-align: center;">
                        <table style="border-collapse: collapse;border-spacing: 0;position: relative;/* min-height: 40px; */width: 100%;box-sizing: border-box;padding-top: 0px;padding-bottom: 0px;padding-left: 0px;padding-right: 0px;max-width: 600px;text-align: center;">
                            <tbody>
                            <tr>
                                <td style="border-collapse: collapse; font-family: Arial; line-height: 0px; mso-line-height-rule: exactly; padding: 0px;">
                                    <table width="100%"
                                           style="border-collapse: collapse; border-spacing: 0; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td align="center"
                                                style="border-collapse: collapse; padding: 0; line-height: 0px; mso-line-height-rule: exactly;">
                                                <table style="width: 100%;background-color: #ffb136;color: #fff;background-repeat: no-repeat;background-size: contain;background-position: right;">
                                                    <tbody>
                                                    <tr style="height: 6rem;">
                                                        <td style="">
                                                            <table style="max-width: 50%">
                                                                <tbody>
                                                                <tr style="margin-bottom: 6px;display: block;">
                                                                    <td>
                                                                        <img style="margin-left:10px;margin-top:10px;height: 100px;width: 100px;border-radius:100%"
                                                                             src="{{logo_default}}">
                                                                    </td>
                                                                </tr>
                                                                <tr style="line-height: 20px;">
                                                                    <td>
                                                                        <span style="margin-left:10px;margin-top:10px;color: #fff;display: block;font-size: 10pt">{{date}}</span>
                                                                    </td>
                                                                </tr>
                                                                <tr style="line-height: 20px;">
                                                                    <td>
                                                                        <span style="margin-left:10px;margin-top:10px;display: block;font-size: 15pt;color: #fff">Obrigado por viajar,{{customerName}}</span>
                                                                    </td>
                                                                </tr>
                                                                <tr style="line-height: 20px;">
                                                                    <td>
                                                                        <span style="margin-left:10px;margin-top:10px;display: block;font-size: 12pt;color: #fff;">Esperamos que você tenha gostado da viagem.</span>
                                                                    </td>
                                                                </tr>
                                                                </tbody>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table style="margin-top: 10px;border-collapse: collapse; border-spacing: 0; position: relative; min-height: 40px; width: 100%; box-sizing: border-box;">
                            <tbody>
                            <tr>
                                <td style="border-collapse: collapse; padding: 10px 15px; font-family: Arial;">
                                    <table width="100%"
                                           style="border-collapse: collapse; border-spacing: 0; text-align: left; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td style="border-collapse: collapse;">
                                                <h4 style="font-weight: 500;font-size: 18pt; margin: 0;color: #504c4c;">
                                                    Total</h4>
                                            </td>
                                            <td style="border-collapse: collapse;text-align: right">
                                                <h4 style="font-weight: 500;font-size: 18pt;margin: 0;color: #504c4c;">
                                                    {{currency}}{{total}}</h4>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table style="border-collapse: collapse; border-spacing: 0; position: relative; min-height: 40px; width: 100%; box-sizing: border-box; display: table;">
                            <tbody>
                            <tr>
                                <td style="border-collapse: collapse; padding: 10px 15px; font-family: Arial;">
                                    <table width="100%"
                                           style="border-collapse: collapse; border-spacing: 0; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td style="border-collapse: collapse;">
                                                <hr style="border-color: #BBB; border-style: dashed;">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table style="border-collapse: collapse; border-spacing: 0; position: relative; min-height: 40px; width: 100%; box-sizing: border-box; padding-top: 10px; padding-bottom: 10px; text-align: center;">
                            <tbody>
                            <tr>
                                <td style="border-collapse: collapse; padding: 10px 15px; font-family: Arial;">
                                    <table width="100%"
                                           style="border-collapse: collapse; border-spacing: 0; text-align: left; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td style="border-collapse: collapse;">
                                                <p style="font-weight: 500;font-size: 13pt; margin: 0;color: #504c4c;">
                                                    Pagamento</p>
                                            </td>
                                            <td style="border-collapse: collapse;text-align: right">
                                                <p style="font-weight: 500;font-size: 13pt;margin: 0;color: #504c4c;">
                                                    {{paymentForm}}</p>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table style="background-color: #e6e6e6;border-collapse: collapse; border-spacing: 0; position: relative; min-height: 40px; width: 100%; box-sizing: border-box;">
                            <tbody>
                            <tr>
                                <td style="border-collapse: collapse; padding: 10px 15px; font-family: Arial;">
                                    <table width="170" align="left"
                                           style="border-collapse: collapse; border-spacing: 0; font-family: Arial; margin-right: 10px;">
                                        <tbody>
                                        <tr>
                                            <td align="center" style="border-collapse: collapse; padding-right: 10px;">
                                                <a target="_blank"
                                                   style="text-decoration: none; display: inline-block; font-family: arial; box-sizing: border-box; width: 100%;"><img
                                                        width="130" height="130px"
                                                        style="min-width: 130px!important; display: block; box-sizing: border-box; padding-left: 0px!important; width: 130px; height: 130px; border-radius: 130px;"
                                                        class="partial-image signature-partial-image"
                                                        src="{{profileImageDriver}}"></a>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                    <table width="300" align="left"
                                           style="border-collapse: collapse; border-spacing: 0; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td style="border-collapse: collapse;">
                                                <table style="border-collapse: collapse; border-spacing: 0;">
                                                    <tbody>
                                                    <tr>
                                                        <td style="border-collapse: collapse; font-family: Arial; font-size: 20px; line-height: 25px; text-align: left; font-weight: normal; color: #666; padding-top: 20px;">
                                                            <div><a target="_blank"
                                                                    style="text-decoration: none;
                                                                     display: inline-block; box-sizing: border-box;
                                                                     font-size: 20px; font-weight: normal; font-family: Arial;
                                                                     color: #666; margin-bottom: 5px; text-align: left; word-wrap: break-word;
                                                                     width: auto!important; line-height: 30px;">
                                                                {{driverName}}
                                                            </a></div>
                                                            <span style="word-wrap: break-word; font-size: 15px;display: block;font-family: Arial; line-height: 25px;">
                                                                Avaliação:
                                                                {{rated}}</span>
                                                            <span style="word-wrap: break-word; font-size: 15px;display: block;font-family: Arial; line-height: 25px;">
                                                                Carro:
                                                                {{dataCar}}</span>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table style="border-collapse: collapse; border-spacing: 0; position: relative; min-height: 40px; width: 100%; box-sizing: border-box;">
                            <tbody>
                            <tr>
                                <td style="border-collapse: collapse; padding: 10px 15px; font-family: Arial;">
                                    <table width="50%" align="left"
                                           style="border-collapse: collapse; border-spacing: 0; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td align="center" style="border-collapse: collapse; padding-right: 10px;">
                                                <a target="_blank"
                                                   style="text-decoration: none; display: inline-block; font-family: arial; box-sizing: border-box; width: 100%;">
                                                    <img
                                                            style="min-width: 150px!important; display: block; box-sizing: border-box; padding-left: 0px!important; width: 100%; height: 200px;"
                                                            class="partial-image signature-partial-image"
                                                            src="{{mapImage}}"></a>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                    <table width="50%" align="left"
                                           style="border-collapse: collapse; border-spacing: 0; font-family: Arial;">
                                        <tbody>
                                        <tr>
                                            <td style="border-collapse: collapse;">
                                                <table style="border-collapse: collapse; border-spacing: 0;">
                                                    <tbody>
                                                    <tr>
                                                        <td style="border-collapse: collapse; font-family: Arial; font-size: 20px; line-height: 25px; text-align: left; font-weight: normal; color: #666; padding-top: 20px;">
                                                            <span style="word-wrap: break-word; font-size: 15px;display: block;font-family: Arial; line-height: 25px;">
                                                                <div style="
                                                                    width: 10px;
                                                                    height: 10px;
                                                                    background-color: green;
                                                                    display: inline-block;
                                                                    border-radius: 100%;
                                                                    margin-right: 5px;
                                                                    "></div>

                                                                {{origin}}</span>
                                                            <span style="word-wrap: break-word; font-size: 15px;display: block;font-family: Arial; line-height: 25px;">
                                                                <div style="
                                                                    width: 10px;
                                                                    height: 10px;
                                                                    background-color: red;
                                                                    display: inline-block;
                                                                    border-radius: 100%;
                                                                    margin-right: 5px;
                                                                    "></div>
                                                                {{destination}}</span>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </td>
                </tr>
                </tbody>
            </table>
        </td>
    </tr>
    </tbody>
</table>


</body>
</html>
