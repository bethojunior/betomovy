<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style type="text/css">
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        a{
            color: #fff;
            text-decoration: none;
        }
        body{
            font-family:'Calibri';
            background-color: #E4E4E4;
            color: #50545C;
        }
        section {
            margin: 2vw 10vw;
        }
        section h1{
            font-size: 2.7em;
            margin: 0px 0 25px 0;
            text-align: center;
            letter-spacing: 2px;
        }
        section p{
            font-size: 1.1em;
            text-align: justify;

        }
    </style>
</head>
<body>
<div>
    <section>
        <h1>{{title}}</h1>
        <p>{{message}}</p>
    </section>
</div>
</body>
</html>
