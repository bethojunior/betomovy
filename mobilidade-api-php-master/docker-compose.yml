version: "3.7"
services:
    api:
        build:
            args:
                user: sammy
                uid: 1000
            context: .
            dockerfile: Dockerfile
        image: api
        container_name: api
        restart: unless-stopped
        working_dir: /var/www/
        ports:
            - 8101:80
        networks:
            - fabrica704-mobilidade
        volumes:
            - ./:/var/www
    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        command: ["redis-server", "--requirepass", "password"]
        volumes:
            - redis-data:/data
        networks:
            - fabrica704-mobilidade

networks:
    fabrica704-mobilidade:
        driver: bridge
volumes:
  redis-data:
    driver: local
