<div class='modal-bank-account'>
    <div>
        <i class="material-icons" id="closeModalBankAccount">close</i>
        <h4 id="titleBankAccount">Cadastro de conta</h4>
        <form id="formSignupAccount">
            <input type="text" name="holderName" class="input-customer-bank" placeholder="Nome">
            <input type="tel" name="document" id="documentBank" class="input-customer-bank cpf-bank" placeholder="CPF">
            <select name="typeAccount">
                <option value="" disabled selected>TIPO DA CONTA</option>
                <option value="corrente">CORRENTE</option>
                <option value="poupanca">POUPANÇA</option>
            </select>
           <!-- <select name="bankId" id="bankAccount">
                <option disabled selected>SELECIONE UM BANCO</option>
            </select>-->
            <input type="text" name="bankId" id="bankAccount" placeholder="Nome do banco">
            <input type="text" name="agency" class="input-customer-bank agency-bank" placeholder="Agência">
            <input type="text" name="agencyDigit" class="input-customer-bank agency-digit-bank" placeholder="Digito">
            <input type="text" name="numberAccount" class="input-customer-bank number-account-bank"
                   placeholder="Numero da conta">
            <input type="text" name="numberAccountDigit" class="input-customer-bank number-account-digit-bank"
                   placeholder="Digito">
            <input type="text" name="op" class="input-customer-bank op-bank" id="opBank" placeholder="OP">
            <input type="text" name="pix" class="input-customer-bank pix-bank" id="pixBank" placeholder="PIX">
        </form>
        <div>
            <button type="button" id="btnSaveAccountBank">SALVAR</button>
        </div>
    </div>
</div>
