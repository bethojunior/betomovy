<div class="container-login">
    <div>
        <img src="webfiles/img/logo/logo.png"
             class="logo-company logo-preview-app">
        <form class="form-login">
            <div>
                <i class="material-icons">person</i>
                <input class="col s12" type="email" id="email" placeholder="" data-i18n="login-placeholder-email">
            </div>
            <div>
                <i class="material-icons">vpn_key</i>
                <input type="password" id="password" class="validate" placeholder="" data-i18n="login-placeholder-password">
            </div>
            <a href="index.html?Main&ForgetPassword" data-i18n="login-a-forget-password"></a>
            <button type="button" class="authenticate-user" data-i18n="login-button-login"></button>
        </form>
        <div class="sign-up">
            <a href="index.html?Main&Signup" data-i18n="login-a-signup"></a>
            <span class="option-login-social" style="display: none" data-i18n="login-span-another-option"></span>
            <div class="social-list option-login-social">
                <img id="facebookLogin" src="webfiles/img/icon/facebook.png" style="display: none">
                <img id="googlePlusLogin" src="webfiles/img/icon/google-plus.png" style="display: none">
            </div>
        </div>
    </div>
    <a id="openTermsOfUse" data-i18n="login-terms-of-use"></a>
</div>
