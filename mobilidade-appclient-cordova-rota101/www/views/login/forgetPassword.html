<div class="general-forget-password">
    <a class="go-back"><i class="material-icons">arrow_back</i></a>
    <div>
        <img src="webfiles/img/logo/logo.png"
             class="logo-company logo-preview-app">
        <div id="passCheckEmail">
            <p data-i18n="forget-password-p-description"></p>
            <div>
                <i class="material-icons">person</i>
                <input type="email" placeholder="" data-i18n="forget-password-placeholder-input-email-forget"
                       id="emailForgetPassword">
            </div>
            <button id="checkEmail" class="btn" data-i18n="forget-password-check-email"></button>
        </div>

        <div id="secondPass">
            <p data-i18n="forget-password-p-alert-confirm-code"></p>
            <div>
                <input class="readCode" id="code0" type="tel">
                <input class="readCode" id="code1" type="tel">
                <input class="readCode" id="code2" type="tel">
                <input class="readCode" id="code3" type="tel">
            </div>
            <button data-i18n="forget-password-btn-confirm-code" id="checkCode"></button>
        </div>

        <div id="thirdPass">
            <p data-i18n="forget-password-p-description-reset-password"></p>
            <div>
                <i class="material-icons">vpn_key</i>
                <input type="password" placeholder="" id="passwordOne" data-i18n="forget-password-password-one">
            </div>
            <div>
                <i class="material-icons">vpn_key</i>
                <input type="password" placeholder="" id="passwordTwo" data-i18n="forget-password-password-two">
            </div>
            <button id="savePassword" data-i18n="forget-password-btn-save-new-password"></button>
        </div>
    </div>
</div>
