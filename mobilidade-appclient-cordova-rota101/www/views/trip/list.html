<div class='container-list-trips'>

    </div>

        <ul class="container-tab-list-trip active" id="tripsClient" for="allTripsList"></ul>
        <ul class="container-tab-list-trip" id="scheduleTripsCliente" for="scheduleTripsList"></ul>
    </div>
    <div class="tab-list-trip footer-ios-x">
        <div class="tab-item-list-trip active" id="allTripsList">
            <i class="material-icons">
                list
            </i>
            <span data-i18n="trips-span-last-trip"></span>
        </div>
        <div class="tab-item-list-trip" id="scheduleTripsList" style="display: none">
            <i class="material-icons">
                schedule
            </i>
            <span data-i18n="trips-span-schedule-trip"></span>
        </div>
