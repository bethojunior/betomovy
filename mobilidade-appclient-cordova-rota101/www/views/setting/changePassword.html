<div class="menu-setting">
    <i class="material-icons go-back">arrow_back</i>
    <p>Senha</p>
</div>
<div class="container-change-password">
    <div id="containerChangePassword">
        <input type="password" id="currentPassword" placeholder="Senha atual">
        <input type="password" id="newPassword" placeholder="Nova senha">
        <input type="password" id="confirmationPassword" placeholder="Repita a nova senha">
        <p id="messageForgetPassword">Se você esqueceu sua senha, pode <a id="resetPasswordClient">redefini-la</a></p>

        <button type="button" id="btnConfirmationChangePassword">Confirmar</button>
    </div>
    <div id="containerConfirmationCodePassword">
        <span>Enviamos um código de confirmação por SMS para seu número cadastrado.
        Insira-o abaixo.</span>
        <input type="tel" placeholder=" - - - - " id="codeConfirmationPassword">
    </div>
</div>
