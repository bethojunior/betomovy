<div class="general-profile">
    <div class="profile-image-driver">
        <div>
            <div class="container-profile-user">
                <div id="spinner">
                    <span id="ball_1" class="spinner_ball"></span>
                    <span id="ball_2" class="spinner_ball"></span>
                    <span id="ball_3" class="spinner_ball"></span>
                </div>
                <i class="material-icons" id="imageUserProfile">edit</i>
            </div>
        </div>
        <p class="name-user">&nbsp;</p>
    </div>
    <ul>
        <li class="active">
            <i class="material-icons">
                format_list_bulleted
            </i>
            <span data-i18n="profile-about-item"></span>
        </li>
    </ul>
    <form class="container-edit-user">
        <div>
            <span data-i18n="profile-span-name"></span>
            <input id="nameProfileUser" class="input-profile-user" disabled>
        </div>
        <div>
            <span data-i18n="signup-label-gender"></span>
            <input id="genderProfileUser" class="input-profile-gender" disabled>
            <a href="index.html?Client&ContactUs">
                Alterar
            </a>
        </div>
        <div>
            <span data-i18n="profile-span-document"></span>
            <input id="documentProfileUser" class="input-profile-user" disabled>
        </div>
        <div>
            <span  data-i18n="profile-span-email"></span>
            <input id="emailProfileUser"  class="input-profile-user" type="email" disabled>
        </div>
        <div>
            <span data-i18n="profile-span-number-phone"></span>
            <input id="phoneProfileUser"  class="input-profile-user" type="tel" disabled>
        </div>
        <div>
            <span data-i18n="profile-span-birthday"></span>
            <input id="birthDateProfileUser" class="input-profile-user" disabled>
        </div>

        <button type="button" class="edit-btn">
            <i class="material-icons">edit</i>
            <span data-i18n="profile-edit-btn"></span>
        </button>

        <div class="container-save-profile">
            <button type="button" class="btn-save-profile" data-i18n="profile-btn-save"></button>
            <button type="button" class="btn-cancel-profile" data-i18n="profile-btn-cancel"></button>
        </div>
    </form>
    <footer class="footer-profile">
    </footer>
</div>
