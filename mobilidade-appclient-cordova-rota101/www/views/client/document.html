<div class="container-document-user">
    <h4>Dados Obrigatórios</h4>
    <div>
        <div>
            <img id="imgProfileCustomer">
            <i class="material-icons" id="addProfileCustomer" property="profileImageCustomer">
                camera_alt
            </i>
            <!--
                        <span>Precisamos de uma foto sua de perfil para que o motorista possa te identificar, agiliza sua viagem e é mais seguro.</span>
            -->
        </div>
        <div>
            <label for="emailCustomer">E-mail</label>
            <input type="email" id="emailCustomer" placeholder="E-mail">
        </div>
        <div>
            <label for="phoneCustomer">Telefone</label>
            <input type="tel" id="phoneCustomer" placeholder="Telefone">
        </div>
        <div>
            <label for="documentCustomer" style="display: none">CPF</label>
            <input type="tel" id="documentCustomer" placeholder="CPF" style="display: none">
        </div>
        <div>
            <label for="rgCustomer" style="display: none">RG</label>
            <input type="tel" id="rgCustomer" placeholder="RG" style="display: none">
        </div>
        <div>
            <label for="dateOfBirthCustomer">Data de nascimento</label>
            <input id="dateOfBirthCustomer" type="tel">
        </div>
        <div class="container-filed-military">
            <label>Tipo de força</label>
            <select id="typeMilitaryForce">
                <option value="" disabled selected>Escolha o tipo de força</option>
            </select>
        </div>
        <div class="container-filed-military">
            <label>POSTO/GRADUAÇÃO</label>
            <select id="typeGraduations">
                <option value="" disabled selected>Defina sua POSTO/GRADUAÇÃO</option>
            </select>
        </div>
        <div class="container-filed-military">
            <label>Status</label>
            <select id="typeStatus">
                <option value="" disabled selected>Tipo de status</option>
            </select>
        </div>
        <div class="container-filed-military container-input-om">
            <label>Organização Militar</label>
            <input type="text" placeholder="Indique sua Organização Militar" id="numberOM"/>
        </div>
        <div class="container-document-pre-sign-up" id="photoRgFront" type="RG_FRONT" var="rgFrontPicture">
            <label>Foto da frente do RG</label>
            <i class="material-icons">cloud_upload</i>
        </div>
        <div class="container-document-pre-sign-up" id="photoRgBack" type="RG_BACK" var="rgBackPicture">
            <label>Foto do verso do RG</label>
            <i class="material-icons">cloud_upload</i>
        </div>
        <button type="button" id="saveDataCustomer">Salvar</button>
    </div>
</div>
<div class="preload-document-user"></div>
