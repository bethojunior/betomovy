name: movy-app
region: nyc
# Deploy trigger: 2026-11-09 13:05 UTC - Deploy MOVY Mobile Pro, Splash Obsidian Navy, i18n pt_BR and Central fixes

services:
  # 1. Site Institucional (React SPA) - Rota Principal
  - name: site-web
    source_dir: mobilidade-site-novo-main
    dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: developeragencia/movy
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: REACT_APP_PROJECT_NAME
        value: Movy
      - key: REACT_APP_API_APP_HOST
        value: https://api.movymob.com/
      - key: REACT_APP_BUCKET_NAME
        value: movy-storage
      - key: REACT_APP_BUCKET_URL
        value: https://s3.amazonaws.com/

  # 2. Central Administrativa (PHP)
  - name: central-web
    source_dir: mobilidade-central-master
    dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: developeragencia/movy
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /
      initial_delay_seconds: 60
      period_seconds: 15
    routes:
      - path: /central
    envs:
      - key: API_HOST
        value: https://api.movymob.com/
      - key: APIAPP_HOST
        value: https://api.movymob.com/
      - key: API_SOCKET_HOST
        value: https://socket.movymob.com/
      - key: APP_PARTNER
        value: "true"
      - key: BUCKET_NAME
        value: rota101fb704
      - key: STORAGE_PRIMARY_HOST
        value: https://api.movymob.com

  # 3. Monitor (Painel Web Administrativo React + Vite)
  - name: monitor-web
    source_dir: mobilidade-monitor-new-main
    dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: developeragencia/movy
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 10
    routes:
      - path: /monitor
    envs:
      - key: SEU_MILTO_V2
        value: https://api.movymob.com/
      - key: SEU_MILTO_V1
        value: https://api.movymob.com/
      - key: API_APP
        value: https://api.movymob.com/
      - key: HOST_SOCKET
        value: https://socket.movymob.com/
      - key: PROJECT_NAME
        value: movy
      - key: LINK_SITE_WEB
        value: https://movymob.com/

