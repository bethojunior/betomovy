name: movy-platform
region: nyc

services:
  # 1. Site Institucional (React SPA) - Rota Principal
  - name: site-web
    source_dir: mobilidade-site-novo-main
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

  # 2. Central Administrativa (PHP)
  - name: central-web
    source_dir: mobilidade-central-master
    dockerfile_path: Dockerfile
    http_port: 92
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /central

  # 3. Monitor (Painel Web Administrativo React + Vite)
  - name: monitor-web
    source_dir: mobilidade-monitor-new-main
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /monitor

  # 4. API PHP Principal (Mobilidade Urbana Core)
  - name: api-php
    source_dir: mobilidade-api-php-master
    dockerfile_path: Dockerfile
    http_port: 81
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /api

  # 5. WebSocket & Realtime Node.js
  - name: api-node-ws
    source_dir: mobilidade-api-node-main
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /ws
