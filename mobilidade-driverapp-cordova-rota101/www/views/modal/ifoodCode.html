<div class="container-ifood-code">
  <div class="content-ifood-code">
    <div class="header-ifood-code">
      <h2>Código de Entrega</h2>
    </div>
    <div class="body-ifood-code">
      <p>Por favor, insira o código fornecido pelo cliente:</p>
      <input
        type="number"
        id="ifoodCodeInput"
        class="code-input"
        maxlength="4"
        pattern="[0-9]*"
        inputmode="numeric"
        autocomplete="off"
      />
      <div class="error-message" style="display: none">
        <i class="fa fa-exclamation-circle error-icon"></i>
        <span>Código inválido. Por favor, verifique e tente novamente.</span>
      </div>
      <button id="btnSendCode" class="btn-send-code">
        <span class="btn-text">Enviar Código</span>
        <div class="btn-loading" style="display: none">
          <div class="spinner-inline"></div>
          <span>Verificando...</span>
        </div>
      </button>

      <button id="closeIfoodCode" class="btn-close">
        Não conseguir encontrar o cliente
      </button>

      <div class="success-message" style="display: none">
        <div class="success-icon">
          <i class="fa fa-check"></i>
        </div>
        <span>Código validado com sucesso!</span>
      </div>
    </div>
  </div>
</div>
