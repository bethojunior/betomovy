<div class="container-modal-pix-payment">

          <div class="container-pix-payment-info-header-title">
            <h4 id="type-payment">Pix</h4>
            <h4 id="value-pix"></h4>
          </div>
        </div>
        <div class="container-pix-payment-info-body">

          <div class="container-pix-payment-info-body-qr-code">
            <img id="qr-code-pix" src="" alt="QR Code" />
          </div>
          <div class="container-pix-payment-info-body-pix">
            <div class="container-pix-payment-info-body-pix-key" id="copy-pix">
              <input type="text" id="input-pix-key" disabled />
              <button class="btn btn-primary" id="btn-copy-pix">Copiar código</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
