<div class="container-edit-profile">
    <div>
        <div>
            <i class="material-icons">portrait</i>
            <p data-i18n="edit-profile-title-photo-profile"></p>
        </div>
        <div>
            <div class="container-edit-profile-preview">
                <div class="edit-profile-driver">
                    <div>
                        <i class="material-icons"></i>
                        <p data-i18n="edit-profile-btn-edit"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div>
        <div>
            <i class="material-icons">vpn_key</i>
            <p data-i18n="edit-profile-title-change-password"></p>
        </div>
        <div>
            <div class="container-edit-password">
                <div>
                    <label data-i18n="edit-profile-current-password"></label>
                    <input type="password" id="currentPassword">
                </div>
                <div>
                    <label data-i18n="edit-profile-new-password"></label>
                    <input type="password" id="newPassword">
                </div>
                <div>
                    <label data-i18n="edit-profile-confirm-password"></label>
                    <input type="password" id="confirmationPassword">
                </div>
                <button type="button" id="btnChangePassword" data-i18n="edit-profile-change-password"></button>
            </div>
        </div>
    </div>
</div>
