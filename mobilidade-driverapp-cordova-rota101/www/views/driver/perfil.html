<div class="container-profile">
    <div class="container-data-profile">
        <div class="image-profile-driver"></div>
        <p class="name-driver">-</p>
        <span id="dataCarDriver">-</span>
    </div>
    <div class="container-data-driver">
        <div>
            <p id="totalTripFinished">-</p>
            <span data-i18n="profile-amount-trips"></span>
        </div>
        <div>
            <p id="driverRating">-</p>
            <span data-i18n="profile-driver-rating"></span>
        </div>
    </div>
    <ul class="container-data-driver-options">
        <li id="editProfileDriver">
            <i class="material-icons">edit</i>
            <p data-i18n="profile-li-edit-profile"></p>
        </li>
        <li id="accountInProfile">
            <i class="material-icons">attach_money</i>
            <p data-i18n="profile-li-account-profile"></p>
        </li>
        <li id="reportSupport">
            <i class="material-icons">report_problem</i>
            <p data-i18n="profile-li-report-support"></p>
        </li>
        <li id="reportDebug">
            <i class="material-icons">report</i>
            <p data-i18n="profile-li-report-debug"></p>
        </li>
        <li id="vehicleDriver">
            <i class="material-icons">directions_car</i>
            <p data-i18n="profile-li-vehicle-driver"></p>
        </li>
        <li id="qrcodeFiscalizacao">
            <i class="material-icons">verified_user</i>
            <p data-i18n="profile-li-qrcode-fiscalizacao"></p>
        </li>
        <li id="settingApp">
            <i class="material-icons">settings</i>
            <p data-i18n="profile-li-setting-app"></p>
        </li>
        <li id="excludeApp">
            <i class="material-icons">delete_forever</i>
            <p data-i18n="profile-li-remove-account"></p>
        </li>
        <li id="logoutByProfile">
            <i class="material-icons">exit_to_app</i>
            <p data-i18n="profile-li-logout">Sair</p>
        </li>
    </ul>
</div>
