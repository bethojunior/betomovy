<div class="info-chat-trip">
    <a class="back-page">
        <i class="backIcon material-icons">arrow_back</i>
    </a>
    <h4 class="name-establishment-chat"></h4>
    <i class="material-icons" id="callNumberClient" style="display: none">call</i>
</div>
<div class="container-chat-trip" id="container-chat-trip">
    <div class="info-client" id="infoClient">
        <div class="margin-default-chat">
            <div class="continer-messages" id="continer-messages">
                <ul id="messagesDriver">

                </ul>
            </div>
        </div>
    </div>
</div>
<div class="contentDataSend">
    <input id="messageTripDriver" placeholder="" class="message-trip-driver" data-i18n="chat-placeholder-input">
    
    <div class="option-message" id="audio-controls">
        
        <i class="material-icons btn-cancel-audio-locked">arrow_back</i> 

        <span class="audio-timer-locked" style="display:none;">00:00</span>
        
        <i class="material-icons" id="captureAudio">settings_voice</i>
        

        
        <div>
            <i class="material-icons delete-audio">delete</i> 
        </div>
        
        <i class="material-icons btn-send-audio-locked" style="display:none;">send</i> 
        
        <p class="btn-send-message" data-i18n="chat-btn-send"></p>
    </div>
</div>
