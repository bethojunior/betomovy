<script>
    document.addEventListener("deviceready", function () {
        document.body.style.display = "none";

        if (window.StatusBar) {
            StatusBar.overlaysWebView(false);
            const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main-color-hex').trim();
            StatusBar.backgroundColorByHexString(mainColor);
            StatusBar.styleLightContent();
        }

        if (window.MobileAccessibility) {
            window.MobileAccessibility.usePreferredTextZoom(false);
        }

        Promise.all([
            checkLayoutByConfig(),
            verifyPreferredLanguage(),
            new Promise(resolve => {
                if (cordova?.getAppVersion) {
                    cordova.getAppVersion.getVersionNumber(
                        v => { setAppVersion(v); resolve(); },
                        () => { setAppVersion(""); resolve(); }
                    );
                } else {
                    setAppVersion("");
                    resolve();
                }
            })
        ]).then(values => {
            setPreferredLanguage(values[1]).then(() => {
                const route = Route.getClassAndAction();
                ManagerView[route.classView][route.actionName]();
            })
        });
    })
</script>
