server {
  listen 8080;
  listen 80;
  # Proxy para login e rotas de API caso requisitadas na raiz do site
  location /login {
    proxy_pass https://api.movymob.com/login;
    proxy_set_header Host api.movymob.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  location /api/ {
    proxy_pass https://api.movymob.com/;
    proxy_set_header Host api.movymob.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  location /usertype/ {
    proxy_pass https://api.movymob.com/usertype/;
    proxy_set_header Host api.movymob.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  location /formstep/ {
    proxy_pass https://api.movymob.com/formstep/;
    proxy_set_header Host api.movymob.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  location /DocUserType/ {
    proxy_pass https://api.movymob.com/DocUserType/;
    proxy_set_header Host api.movymob.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  location /config/ {
    proxy_pass https://api.movymob.com/config/;
    proxy_set_header Host api.movymob.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }

  location = /privacy {
    root /usr/share/nginx/html;
    try_files /privacy.html /privacidade.html /index.html;
  }

  location = /privacidade {
    root /usr/share/nginx/html;
    try_files /privacidade.html /privacy.html /index.html;
  }

  location = /privacy-policy {
    root /usr/share/nginx/html;
    try_files /privacy-policy.html /privacy.html /index.html;
  }

  location = /politica-de-privacidade {
    root /usr/share/nginx/html;
    try_files /politica-de-privacidade.html /privacidade.html /index.html;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires -1; # Set it to different value depending on your standard requirements
  }
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
  location = /.env {
    deny all;
    return 404;
  }
  location = /.env.sh {
    deny all;
    return 404;
  }
  location = /.env.build {
    deny all;
    return 404;
  }
}