name: Claude Code Review

# Dispara SOMENTE quando alguém escrever "@claude" em um comentário do PR
# (seja no PR principal ou numa review de linha específica do diff).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Só roda se o comentário mencionar @claude — evita gastar créditos à toa
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read          # só precisa ler o código, não vai commitar nada
      pull-requests: write    # precisa para postar os comentários da review
      issues: write           # necessário para o comentário-resumo em alguns casos
      id-token: write         # exigido pela action para autenticação
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Revise este pull request focando em: bugs e regressões,
            problemas de segurança, gargalos de performance e legibilidade/
            manutenibilidade do código. Poste comentários inline no diff
            onde fizer sentido, e finalize com um resumo objetivo dos
            riscos encontrados (não apenas elogios).
