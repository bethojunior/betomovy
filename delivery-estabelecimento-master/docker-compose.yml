version: "3.7"
services:
  deliveryadm:
    build:
      args:
        user: sammy
        uid: 1000
      context: .
      dockerfile: Dockerfile
    image: deliveryadm
    container_name: deliveryadm
    restart: unless-stopped
    ports:
      - "8000:80"
    working_dir: /var/www/
    volumes:
      - ./:/var/www
