user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # -----------------------
    # Gzip
    # -----------------------
    gzip                on;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_buffers        16 8k;
    gzip_http_version   1.1;
    gzip_proxied        expired no-cache no-store private auth;
    gzip_vary           on;
    gzip_disable        "MSIE [1-6]\.";
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/xhtml+xml
        application/xml
        application/svg+xml
        font/ttf font/otf application/font-woff font/woff font/woff2
        image/svg+xml image/x-icon
        text/css text/javascript text/plain text/xml;

    # Se você pré-gera .gz/.br de assets, pode ligar gzip_static:
    # gzip_static on;

    # -----------------------
    # Expiração por tipo
    # -----------------------
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        font/ttf                   max;
        font/otf                   max;
        font/woff                  max;
        font/woff2                 max;
    }

    # -----------------------
    # Servidor Laravel
    # -----------------------
    server {
        listen       80 default_server;
        server_name  _;
        root   /var/www/html/public;
        index  index.php index.html index.htm;

        charset utf-8;

        # Tamanho de upload alinhado com PHP
        client_max_body_size 256M;

        # Headers de segurança básicos
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Cache control por tipo (definido no map acima)
        expires $expires;

        # App (front controller)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Ícones/robots
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # PHP via PHP-FPM (socket padrão do Remi)
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_index index.php;
            fastcgi_keep_conn on;

            # ajuste o socket se for diferente no seu www.conf
            fastcgi_pass unix:/run/php-fpm/www.sock;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # Erros
        error_page   500 502 503 504  /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }

        # 🔒 Bloqueios de arquivos sensíveis
        location ~* \.(?:env|env\.backup|env\.example|env\.local)$ { deny all; }
        location ~* \.(?:git|hg|bzr|svn) { deny all; }
        location ~ /\. { deny all; }           # arquivos ocultos
        location ~ /\.(?!well-known).* { deny all; }

        # Fonts com CORS + cache
        location ~* \.(?:eot|woff|woff2|ttf|svg|otf|svg|webp|avif)$ {
            expires           max;
            add_header        Access-Control-Allow-Origin *;
            access_log        off;
        }

        # Arquivos estáticos comuns (cache)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|avif)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}