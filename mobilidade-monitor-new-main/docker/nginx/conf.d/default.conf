server {
  listen 80;
  listen 8080;

  # App Platform pode encaminhar /monitor/... com prefixo
  rewrite ^/monitor/?(.*)$ /$1 last;

  location /assets/ {
    root   /usr/share/nginx/html;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
  location = /.env {
    deny all;
    return 404;
  }
  location = /.env.sh {
    deny all;
    return 404;
  }
  location = /.env.build {
    deny all;
    return 404;
  }
}