version: "3.7"
services:
    centralapi:
        build:
            args:
                user: sammy
                uid: 1000
            context: .
            dockerfile: Dockerfile
        image: centralapi
        container_name: centralapi
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d/

    nginx:
        image: nginx:alpine
        container_name: centralapi-nginx
        restart: unless-stopped
        links:
            - "centralapi:centralapi"
        ports:
            - 8004:80
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d/

networks:
    fabrica704-mobilidade:
        driver: bridge