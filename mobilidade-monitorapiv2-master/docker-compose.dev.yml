services:
  app:
    platform: linux/amd64
    build:
      context: .
      target: app-dev
      dockerfile: Dockerfile-dev
      args:
        # To authenticate to private registry either use username / password, or Oauth key/secret / etc
        # Please add Composer Auth JSON Object
        COMPOSER_AUTH: "{}"
        APP_BASE_DIR: ${APP_BASE_DIR-.}
    restart: unless-stopped
    volumes:
      - ${APP_BASE_DIR-.}:/app
    networks:
      - apps704apiv2

  web:
    build:
      context: .
      target: web-dev
      args:
        APP_BASE_DIR: ${APP_BASE_DIR-.}
    restart: unless-stopped
    ports:
      - "8100:8080"
    environment:
      # The Hostname for the FPM (needs to match the hostname for the `app`)
      PHP_FPM_HOST: app
    volumes:
      - ${APP_BASE_DIR-.}/public:/app/public
    depends_on:
      - app
    networks:
      - apps704apiv2
  redis:
    image: redis:latest
    container_name: redis
    ports:
        - "6379:6379"
    command: ["redis-server"]
    volumes:
        - redis-data:/data
    networks:
        - apps704apiv2

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voutehomologar
      MYSQL_USER: voutehomologar
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./.sql:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - apps704apiv2

  mongo:
    image: mongo:7.0.14
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - apps704apiv2

networks:
  apps704apiv2:
    driver: bridge

volumes:
  redis-data:
  mysql-data:
  mongo-data:
