name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: gcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set output
        id: vars
        run: echo "::set-output name=tag::$(git rev-parse --short $GITHUB_SHA)"  

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-dockerhub
          target: app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mobilidade-monitor-apiv2:${{ steps.vars.outputs.tag }}-app
      
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-dockerhub
          target: web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mobilidade-monitor-apiv2:${{ steps.vars.outputs.tag }}-web