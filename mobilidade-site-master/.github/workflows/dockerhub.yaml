name: Build and Push Docker Image

# Quando a pipeline será executada
on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: gcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      # Configura o Buildx para construir a imagem
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Faz login no Docker Hub usando as credenciais armazenadas
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set output
        id: vars
        run: echo "::set-output name=tag::$(git rev-parse --short $GITHUB_SHA)"  

      # Constrói e sobe a imagem para o Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-dockerhub 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mobilidade-site:${{ steps.vars.outputs.tag }}
